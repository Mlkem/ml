name: Release
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      phone_tested:
        description: 'Stable only: phone tests passed and are recorded in docs/phone-testing.md'
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_name == 'dev' || (github.ref_name == 'main' && github.event_name == 'workflow_dispatch' && inputs.phone_tested)
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Check stable phone-test record
        if: github.ref_name == 'main'
        run: python3 scripts/check_phone_testing.py
      - name: Install release dependencies
        run: npm ci
      - name: Build and verify collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
          python3 scripts/verify_bundle.py
      - name: Restore generated files before semantic release
        run: git restore patches-list.json
      - name: Publish with Morphe semantic-release template
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
      - name: Attest release
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Mlkem Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

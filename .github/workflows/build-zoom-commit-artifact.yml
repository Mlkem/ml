name: Build Zoom Earth MPP and commit artifact

on:
  push:
    branches: [ main ]

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[zoom-artifact]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build and capture log
        id: build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          gradle :patches:buildAndroid --stacktrace 2>&1 | tee zoom-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          if [ "$status" -eq 0 ]; then
            cp patches/build/libs/*.mpp artifacts/zoom-earth-liteapk-nag.mpp
          else
            cp zoom-build.log artifacts/zoom-earth-build.log
          fi
          exit 0

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          git commit -m "[zoom-artifact] Build Zoom Earth MPP result" || exit 0
          git push
